name: ESO Code Watcher
on:
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eso-code-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check RSS and post to Discord
        env:
          RSS_FEED_URL: ${{ secrets.RSS_FEED_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python watcher.py
      - name: Save article history
        run: |
          if ! git diff --quiet -- seen_articles.json || [ -n "$(git ls-files --others --exclude-standard seen_articles.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_articles.json
            git commit -m "Update seen ESO announcements"
            git push
          fi
